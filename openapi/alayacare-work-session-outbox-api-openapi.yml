openapi: 3.2.0
info:
  title: Alayacare work session outbox API
  version: '1.0'
servers:
- url: https://api.{env}.alayamarket.{region}/offers
  variables:
    env:
      description: The server environment.
      enum:
      - staging
      - sandbox
      - prod
      default: prod
    region:
      description: The server top-level domain indicating the region.
      enum:
      - ca
      - com
      - com.au
      default: ca
security:
- CognitoAuthorizer: []
tags:
- name: work session outbox
paths:
  /v1/outbox/work_sessions:
    parameters:
    - in: query
      name: visit_id
      schema:
        type: string
      description: ID of a visit.
      required: false
    - in: query
      name: visit_outbox_id
      schema:
        type: string
      description: ID of a visit in the demand system.
      required: false
    get:
      tags:
      - work session outbox
      description: '# Authorization

        Required role: demand `org_admin` who created the associated referral.


        # Description

        Get a collection of Work Sessions for a given visit.


        One of `visit_id` or `visit_outbox_id` must be provided.

        '
      responses:
        200:
          description: Successfully retrieved a collection of Work Sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxWorkSessionPageResponse'
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OfferApiFunctionV2.Arn}:live/invocations
        httpMethod: POST
        passthroughBehavior: when_no_match
        type: aws_proxy
components:
  schemas:
    OutboxWorkSessionCollectionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
        visit_outbox_id:
          type: string
          description: ID of the visit provided by the demand organization.
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        start_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        start_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        end_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        end_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
      required:
      - id
      - visit_id
      - start_at
    OutboxWorkSessionPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutboxWorkSessionCollectionResponse'
      required:
      - items
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
        - Fn::Sub: '{{resolve:ssm:/${StackName}/${UserPoolArnSSMParameterName}}}'
x-amazon-apigateway-request-validators:
  body:
    validateRequestBody: true
    validateRequestParameters: false
  params:
    validateRequestBody: false
    validateRequestParameters: true
  params-and-body:
    validateRequestBody: true
    validateRequestParameters: true
x-amazon-apigateway-request-validator: params
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{"message": $context.error.messageString, "description": "$context.error.validationErrorString"}'
