openapi: 3.2.0
info:
  title: Alayacare Groups API
  version: '1.0'
  description: 'Operations tagged Groups across 2 of this provider''s published API definitions: alayacare-client-openapi.yml, alayacare-employee-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{server}/ext/api/v2/patients'
  variables:
    server:
      default: https://demo3.alayacare.ca
- url: https://homecare.alayacare.ca/ext/api/v2/employees
tags:
- name: Groups
  description: Client group related endpoints.
paths:
  /groups:
    get:
      tags:
      - Groups
      summary: Get a list of client groups
      operationId: listGroups
      description: Returns a paginated list of client groups.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/branch_id'
      responses:
        '200':
          description: A list of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsList'
        '401':
          $ref: '#/components/responses/ErrorResponseAuthentication'
    servers:
    - url: '{server}/ext/api/v2/patients'
      variables:
        server:
          default: https://demo3.alayacare.ca
components:
  schemas:
    GroupDetail:
      description: Patient group.
      type: object
      properties:
        branch:
          type: object
          description: AlayaCare branch
          properties:
            id:
              type: integer
              description: Branch ID
              example: 1000
            name:
              type: string
              description: Branch name
              example: Toronto branch
        description:
          type: string
          description: description of the group
          example: saint-michel's hospital group
        id:
          type: integer
          description: AlayaCare group ID.
          example: 1
        is_disabled:
          type: boolean
          description: flag indicating if the group is disabled
          example: false
        name:
          type: string
          description: AlayaCare group name
          example: Group A
    ErrorResponse:
      description: Error response
      type: object
      properties:
        code:
          type: integer
          example: 400
          description: Response code
        message:
          type: string
          example: Invalid request
          description: Detailed error message
      required:
      - code
      - message
    PaginatedList:
      description: Base model of all paginated lists
      type: object
      properties:
        count:
          type: integer
          description: Number of items in the response
          example: 1
        page:
          type: integer
          description: Current page number
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available
          example: 1
        items:
          type: array
          items:
            type: object
      required:
      - count
      - page
      - total_pages
      - items
    GroupsList:
      allOf:
      - $ref: '#/components/schemas/PaginatedList'
      - type: object
        description: Paginated list of groups
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/GroupDetail'
    ErrorResponse_2:
      description: Error response
      type: object
      properties:
        code:
          type: integer
          description: Response code
        message:
          type: string
          description: Detailed error message
      required:
      - code
      - message
    GroupListItem:
      allOf:
      - $ref: '#/components/schemas/Group'
      description: AlayaCare group item.
      type: object
      properties:
        branch:
          $ref: '#/components/schemas/BranchSummary'
    GroupList:
      allOf:
      - $ref: '#/components/schemas/PaginatedList_2'
      description: Paginated list of groups
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupListItem'
    BranchSummary:
      description: Branch summary
      type: object
      properties:
        id:
          type: integer
          description: ID of the branch
          example: 1
        name:
          type: string
          description: Name of the branch
          example: Headquarters
    Group:
      description: AlayaCare group.
      type: object
      properties:
        id:
          type: integer
          description: AlayaCare group ID
          example: 1
        name:
          type: string
          description: AlayaCare group name
          example: Group 1
      required:
      - id
      - name
    PaginatedList_2:
      description: Base model of all paginated lists
      type: object
      properties:
        count:
          type: integer
          description: Number of items in the response
          example: 1
        page:
          type: integer
          description: Current page number
          example: 1
        total_pages:
          type: integer
          description: Total number of pages availbale
          example: 1
      required:
      - count
      - page
      - total_pages
      - items
  parameters:
    branch_id:
      description: Filter by branch id.
      name: branch_id
      in: query
      required: false
      schema:
        type: integer
    page:
      description: Filter by page number.
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    count:
      description: Number of items per page.
      name: count
      in: query
      required: false
      schema:
        type: integer
        default: 100
    branch_id_2:
      description: Filter by branch ID
      name: branch_id
      in: query
      required: false
      schema:
        type: integer
  responses:
    ErrorResponseAuthentication:
      description: Authorization required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            response:
              value:
                code: 401
                message: Authorization required.
    ErrorResponseAuthentication_2:
      description: Authorization required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse_2'
          example:
            code: 401
            message: Authorization required.
  securitySchemes:
    basic_auth:
      type: http
      description: Basic HTTP auth over https
      scheme: basic
x-refined-from:
- alayacare-client-openapi.yml
- alayacare-employee-openapi.yml
